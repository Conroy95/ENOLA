<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PROJECT ENOLA // CMD-NL</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#E87524">
  <meta name="background-color" content="#D8C7A5">

  <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ENOLA">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="cmd-header">
    <div class="brand">
      <img src="assets/icons/logo.svg" alt="ENOLA" width="42" height="42">
      <div>
        <h1>PROJECT ENOLA</h1>
        <span>COMMANDOCENTRUM // SECTOR NL</span>
      </div>
    </div>
    <div class="telemetry">
      <div id="live-clock" class="status-badge">--:--:--</div>
      <div id="net-status" class="status-badge">STATUS...</div>
    </div>
  </header>

  <nav class="cmd-nav">
    <button class="nav-btn active" data-target="view-map">[01] TACTISCHE KAART</button>
    <button class="nav-btn" data-target="view-radio">[02] NOODRADIO</button>
    <button class="nav-btn" data-target="view-info">[03] NOODINFO</button>
  </nav>

  <main class="cmd-main">
    <section id="view-map" class="view-section active">
      <div class="tac-panel map-panel">
        <div class="tac-panel-header">
          <span>TACTISCHE KAART // SECTOR NEDERLAND</span>
          <div class="btn-group">
            <button class="tac-btn" id="btn-nl-center">RESET NL</button>
            <button class="tac-btn" id="btn-print-map">PRINT KAART</button>
          </div>
        </div>
        <div id="map"></div>
      </div>
    </section>

    <section id="view-radio" class="view-section">
      <div class="tac-panel">
        <div class="tac-panel-header">
          <span>NOODFREQUENTIES NEDERLAND</span>
        </div>
        <p>Wordt geladen in Fase 4.</p>
      </div>
    </section>

    <section id="view-info" class="view-section">
      <div class="tac-panel">
        <div class="tac-panel-header">
          <span>ESSENTIËLE NOODINFORMATIE</span>
        </div>
        <p>Wordt geladen in Fase 4.</p>
      </div>
    </section>
  </main>

  <footer class="cmd-footer">
    <span>SYS: ENOLA-OS v1.0</span>
    <span>LOCATIE: NEDERLAND</span>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
